<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HAVEN — Websites Built for Your Vision</title>
    <script>
      // SPA redirect for GitHub Pages custom domain / repository subpath
      var segmentCount = 1;
      var loc = window.location;
      var repoBase = loc.pathname.split('/').slice(0, 1 + segmentCount).join('/');
      var subPath = loc.pathname.slice(1).split('/').slice(segmentCount).join('/');
      var query = loc.search ? loc.search : '';
      var hash = loc.hash ? loc.hash : (subPath ? '#' + subPath : '');
      loc.replace(repoBase + '/' + query + hash);
    </script>
  </head>
  <body>
    <p>Redirecting to HAVEN...</p>
  </body>
</html>
